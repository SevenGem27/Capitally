<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Capitally</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a1128"> 
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Capitally"> 
  
  <link rel="apple-touch-icon" href="data:image/png;base64,INCOLLA_QUI_IL_CODICE">
  
  <link rel="stylesheet" href="leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="main-menu" class="overlay">
    <div class="menu-card">
      
      <div id="world-preview-container" style="margin-bottom: 20px; text-align: center;">
          <img src="./icona.png" alt="Capitally Icona" style="width: 200px; max-width: 80%; height: auto; margin-bottom: 15px; border-radius: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.4);">
          <div id="world-status-preview" style="font-size: 16px; color: #555; font-weight: 500;">
              <p style="margin: 0;">Ricostruisci il mondo,<br>un pezzo alla volta.</p>
          </div>
      </div>

      <p id="last-score-text">Ultimo punteggio: -</p>
      <hr style="margin: 15px 0;">
      
      <div id="primary-buttons">
        <button class="btn-primary" onclick="avviaModalita('studio')">📖 Modalità Studio</button>
        <button class="btn-primary" onclick="avviaModalita('libera')">🌍 Modalità Libera</button>
        <button class="btn-primary" onclick="mostraSelettoreTempo()">⏱️ Modalità A Tempo</button>
        
        <button class="btn-secondary" style="margin-top: 15px; background-color: #ffd700; color: #333;" onclick="apriSchermataClassifiche()">🏆 Classifiche Globali</button>
      </div>

      <div id="time-selector" style="display: none;">
        <p style="font-weight: bold; margin-bottom: 10px;">Scegli la durata:</p>
        <button class="btn-secondary" onclick="avviaModalita('tempo', 120)">2 Minuti</button>
        <button class="btn-secondary" onclick="avviaModalita('tempo', 300)">5 Minuti</button>
        <button class="btn-secondary" onclick="avviaModalita('tempo', 600)">10 Minuti</button>
        <button class="btn-danger" style="margin-top: 10px;" onclick="nascondiSelettoreTempo()">🔙 Indietro</button>
      </div>
    </div>
  </div>

  <div id="leaderboard-menu-screen" class="overlay" style="display: none;">
    <div class="menu-card">
      <h2 style="margin-bottom: 10px; color: #333;">🏆 Hall of Fame</h2>
      
      <div style="display: flex; gap: 5px; margin-bottom: 15px;">
        <button class="btn-primary" style="min-height: 35px; font-size: 14px; margin-bottom: 0;" onclick="caricaClassificaMenu(2)">2 Min</button>
        <button class="btn-primary" style="min-height: 35px; font-size: 14px; margin-bottom: 0;" onclick="caricaClassificaMenu(5)">5 Min</button>
        <button class="btn-primary" style="min-height: 35px; font-size: 14px; margin-bottom: 0;" onclick="caricaClassificaMenu(10)">10 Min</button>
      </div>
      
      <h3 id="lb-menu-title" style="margin-top: 0; font-size: 18px;">Seleziona un tempo</h3>
      <ol id="leaderboard-menu-list" style="text-align: left; padding-left: 25px; margin: 10px 0; color: #444; font-weight: bold; min-height: 130px;"></ol>
      
      <button class="btn-danger" style="margin-top: 15px;" onclick="chiudiSchermataClassifiche()">🔙 Torna al Menù</button>
    </div>
  </div>

  <div id="game-over-screen" class="overlay" style="display: none;">
    <div class="menu-card">
      <h2>Tempo Scaduto!</h2>
      <p id="final-score-display" style="font-size: 24px; color: #ffd700; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 5px rgba(0,0,0,0.3);"></p>
      
      <div id="name-input-container" style="margin-bottom: 20px;">
        <input type="text" id="player-name" placeholder="Tuo Nome (max 12 lett.)" maxlength="12" 
               style="width: 80%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 2px solid #c2a153; font-size: 16px; text-align: center; font-weight: bold; outline: none;">
        <button class="btn-primary" id="btn-submit-score" onclick="inviaPunteggioGlobale()" style="background: #28a745; border-color: #1e7e34;">🚀 Invia alla Classifica</button>
      </div>

      <div id="leaderboard-container" style="display: none; margin-top: 15px;">
        <h3>🏆 Top 5 Globale (<span id="lb-time-label"></span> min)</h3>
        <ol id="leaderboard-list" style="text-align: left; padding-left: 25px; margin: 10px 0; color: #444; font-weight: bold;"></ol>
      </div>
      
      <button class="btn-danger" onclick="tornaAlMenu()" style="margin-top: 15px;">Torna al Menù</button>
    </div>
  </div>

  <div id="top-bar">
    <button id="btn-exit" onclick="tornaAlMenu()">🔙 Menù</button>
    <div id="timer-display" style="display: none;">00:00</div>
  </div>

  <div id="ui">
    <div id="target-text">Caricamento...</div>
    <div id="score">Punteggio: 0</div>
  </div>

  <div id="map"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script src="world.js"></script>    <script src="leaflet.js"></script>  <script src="script.js"></script>   <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('SW Registrato');
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            });
          }).catch((err) => console.log('Errore SW:', err));
      });
    }
  </script>
</body>
</html>
